name: P4-B3 Expression Editor ZeroGPU

on:
  pull_request:
    paths:
      - "scripts/p4b3_expression.py"
      - ".github/workflows/p4b3-expression.yml"

permissions:
  contents: read

jobs:
  expression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client dependencies
        run: pip install --disable-pip-version-check pillow gradio_client
      - name: Run Advanced LivePortrait Expression Editor
        run: python scripts/p4b3_expression.py
      - uses: actions/upload-artifact@v4
        with:
          name: p4b3-expression
          path: artifacts/p4b3-expression/surprise-up.png
          if-no-files-found: error
