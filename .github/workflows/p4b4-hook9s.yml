name: P4-B4 Hook 9s

on:
  pull_request:
    branches: [p4b3-zerogpu-smoke]
    paths:
      - "scripts/p4b4_hook9s.py"
      - "scripts/p4b4_hook9s_v2.py"
      - "scripts/p4b4_hook9s_v3.py"
      - "scripts/p4b4_hook9s_v4.py"
      - ".github/workflows/p4b4-hook9s.yml"
      - "assets/p4b3/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          pip install --disable-pip-version-check pillow
      - name: Reuse validated LivePortrait keyframes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/p4b3-keyframes
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9465358775/zip" \
            -o /tmp/p4b3-keyframes.zip
          unzip -q /tmp/p4b3-keyframes.zip -d /tmp/p4b3-keyframes
          find /tmp/p4b3-keyframes -maxdepth 4 -type f -print
      - name: Render 9-second hook v4
        env:
          P4B4_KEYFRAMES: /tmp/p4b3-keyframes
        run: python scripts/p4b4_hook9s_v4.py
      - name: Validate MP4
        run: |
          test -s artifacts/p4b4-hook9s-v4/P4-B4-hook-9s-v4.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 artifacts/p4b4-hook9s-v4/P4-B4-hook-9s-v4.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: p4b4-hook-9s-v4
          path: artifacts/p4b4-hook9s-v4/P4-B4-hook-9s-v4.mp4
          if-no-files-found: error
          retention-days: 30
