name: P4-B3 LivePortrait ZeroGPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveportrait:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client dependencies
        run: pip install --disable-pip-version-check pillow gradio_client
      - name: Run LivePortrait ZeroGPU
        run: python scripts/p4b3_liveportrait.py
      - uses: actions/upload-artifact@v4
        with:
          name: p4b3-liveportrait
          path: artifacts/p4b3-liveportrait/liveportrait.mp4
          if-no-files-found: error
