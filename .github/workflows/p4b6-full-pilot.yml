name: P4-B6 Full Pilot 75s

on:
  pull_request:
    branches: [p4b4-hook-9s]
    paths:
      - "scripts/p4b6_full_pilot.py"
      - ".github/workflows/p4b6-full-pilot.yml"
      - "scripts/p4b5_opening_v2.py"
      - "scripts/p4b4_hook9s_v5.py"
      - "scripts/p4b4_hook9s_v3.py"
      - "assets/p4b4/**"
  workflow_dispatch:

concurrency:
  group: p4b6-full-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          pip install --disable-pip-version-check pillow
      - name: Reuse validated LivePortrait keyframes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/p4b3-keyframes
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9465358775/zip" \
            -o /tmp/p4b3-keyframes.zip
          unzip -q /tmp/p4b3-keyframes.zip -d /tmp/p4b3-keyframes
          find /tmp/p4b3-keyframes -maxdepth 4 -type f -print
      - name: Render full 75-second pilot
        env:
          P4B4_KEYFRAMES: /tmp/p4b3-keyframes
        run: python scripts/p4b6_full_pilot.py
      - name: Validate MP4
        run: |
          test -s artifacts/p4b6-full-pilot-v1/P4-B6-full-pilot-75s-v1.mp4
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=nw=1 \
            artifacts/p4b6-full-pilot-v1/P4-B6-full-pilot-75s-v1.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: p4b6-full-pilot-75s-v1
          path: artifacts/p4b6-full-pilot-v1/P4-B6-full-pilot-75s-v1.mp4
          if-no-files-found: error
          retention-days: 30
